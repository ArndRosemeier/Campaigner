name: Deploy to futuremagic.de

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # FULL history on purpose. The build-status step below asks git
          # whether everything between the newest gate-verified landing and this
          # commit is documentation-only; a depth-1 checkout cannot answer that
          # (the named commit is absent), and the badge would read cannot-tell
          # forever. See scripts/buildStatus.mjs and docs/17 row 250.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No `version` input on purpose: the action reads `packageManager` from
        # package.json, which is the ONE place the pnpm version is declared.
        # `allowBuilds` in pnpm-workspace.yaml needs pnpm 11+, so a stale major
        # pinned here would silently ignore the workspace's build policy.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build domainfactory production bundle
        env:
          CAMPAIGNER_BASE: /Campaigner/
        run: pnpm run build:domainfactory

      - name: Prepare Apache assets in dist/
        run: |
          if [ ! -f public/.htaccess ]; then
            echo "public/.htaccess is missing" >&2
            exit 1
          fi
          # Vite does not copy public/.htaccess (dotfile). Mirror deploy-sync.ps1:
          # strip UTF-8 BOM if present, then set RewriteBase to /Campaigner/.
          sed '1s/^\xEF\xBB\xBF//' public/.htaccess \
            | sed -E 's|^([[:space:]]*RewriteBase[[:space:]]+)\S+|\1/Campaigner/|' \
            > dist/.htaccess
          if [ -f public/futuremagic.json ]; then
            cp public/futuremagic.json dist/futuremagic.json
          fi

      - name: Verify dist/index.html exists
        run: |
          if [ ! -f dist/index.html ]; then
            echo "dist/index.html is missing after build" >&2
            exit 1
          fi

      # THE BUILD-STATUS STEP IS NON-FATAL BY CONSTRUCTION (docs/17 row 250).
      # scripts/buildStatus.mjs writes dist/build-status.json (the badge's
      # verified / WIP / cannot-tell state; it writes cannot-tell itself when
      # anything about the computation fails), and `continue-on-error` is the
      # structural guarantee that no failure in this step can stop the deploy —
      # a deploy that breaks the owner's ability to test the app is the one
      # failure he cannot work around. A failure still shows THIS step as
      # failed, so it is visible rather than silent. The step is one command on
      # purpose: the logic lives in a tested script, never in inline workflow
      # bash.
      - name: Write dist/build-status.json (never fails the deploy)
        continue-on-error: true
        run: node scripts/buildStatus.mjs --board docs/20-ORCHESTRATION.md --out dist/build-status.json

      - name: Upload dist/ via FTP (incremental sync)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.futuremagic.de
          username: 12529-Pyrion
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: /webseiten/Campaigner/
          dangerous-clean-slate: false
